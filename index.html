<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-container">
        <input type="checkbox" id="abrir-envelope">
        
        <label for="abrir-envelope" class="envelope-wrapper">
            
            <!-- Gengars -->
            <div class="gengar gengar-left">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png" alt="Gengar">
            </div>
            <div class="gengar gengar-right">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png" alt="Gengar">
            </div>

            <!-- Envelope -->
            <div class="envelope">
                <div class="aba-topo"></div>
                <div class="corpo-envelope"></div>
            </div>

            <!-- Carta -->
            <div class="carta">
                <div class="foto-box">
                    <img src="foto.jpg" alt="Foto dela">
                </div>
                
                <div class="texto-interno">
                    <h2>Parabéns!! 🎉</h2>
                    <p>Você foi convidada para um Date no próximo fim de semana, onde haverá muitas resenhas, comida e até um soninho se quiser... e aí, topa?</p>
                </div>

                <!-- Botão WhatsApp como link -->
                <a href="https://wa.me/5573981034375?text=Opa,%20vamos%20sim!%20🥰" target="_blank" class="btn-whatsapp">Topar!</a>
                
                <p class="rodape">Feito especialmente pra você</p>
            </div>
        </label>
    </main>

</body>
</html>
